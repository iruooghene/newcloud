version: '3.8'

services:
  app:
    build: .
    container_name: devops2
    environment:
      SPRING.DATASOURCE.URL: jdbc:postgresql://localhost:5432/newcloud_db}
      SPRING.DATASOURCE.USERNAME: postgres
      SPRING.DATASOURCE.PASSWORD: Password
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:15-alpine
    container_name: newcloud
    environment:
      POSTGRES_USER: viccyn
      POSTGRES_PASSWORD: Password
      POSTGRES_DB: newcloud_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  elasticsearch:
    image: elasticsearch:8.0.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  fluentd:
    image: fluent/fluentd:v1.15-1
    container_name: fluentd
    ports:
       - "24224:24224"
       - "24220:24220" # Monitoring
    volumes:
      - ./fluentd/conf:/fluentd/etc
      - /var/log:/var/log # Mount host log directory (optional)
    environment:
      FLUENTD_CONF: "fluent.conf"
    depends_on:
      - elasticsearch

  kibana:
    image: kibana:8.0.0
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # Mount the configuration file
    ports:
      - "9090:9090"  # Expose Prometheus UI
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'  # Point to the config file

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"  # Expose Grafana UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Set admin password
    depends_on:
      - prometheus

volumes:
  postgres_data:
  esdata:
